<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Review the items in your cart and proceed to checkout.">
    <title>Poppy | Shopping Cart</title>
    <link rel="icon" href="../img/Poppy-favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/media.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/7cd9684d81.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <a href="../index.html">
            <img src="../img/poppy_logo.svg" alt="Poppy Logo" class="logo-poppy"/>
        </a>
        <nav class="desktop-nav">
            <i class="fa-solid fa-magnifying-glass"></i>
            <a href="../account/login.html"><i class="fa-regular fa-user"></i></a>
            <a href="../cart/index.html"><i class="fa-solid fa-cart-shopping"></i></a>
        </nav>
    </header>
    <main>
        <section id="cart">
            <H1>Cart</H1>
            <button id="empty-cart" class="cta cta-secondary">Empty Cart</button>
            <div id="cart-details"></div> 
            <div id="cart-summary"></div>
            <a href="../checkout/index.html">
            <button class="cta cta-primary cta-checkout">Proceed to Checkout</button>
            </a>
        </section>
    </main>
        <footer>
            <nav class="mobile-nav">
                <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
                <a href="../account/login.html"><i class="fa-regular fa-user"></i></a>
                <a href="../cart/index.html"><i class="fa-solid fa-cart-shopping"></i></a>
            </nav>
            <section class="footer-desktop">
                <a href="../index.html">
                    <img src="../img/poppy-flower1.svg" alt="Poppy flower logo" class="logo-flower"/>
                </a>
                <ul>
                    <li>&copy; 2026 Poppy</li>
                    <li>Terms of Use</li>
                    <li>Privacy Policy</li>
                </ul>
                <div class="socials">
                    <i class="fa-brands fa-facebook"></i>
                    <i class="fa-brands fa-instagram"></i>
                    <i class="fa-brands fa-youtube"></i>
                </div>
            </section>
        </footer>
    <script src="../js/api.js"></script>
    <script src="../js/cart.js"></script>
</body>
</html>
