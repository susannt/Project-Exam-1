<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Complete your purchase securely by entering your delivery information and payment method.">
    <title>Poppy | Checkout</title>
    <link rel="icon" href="../img/Poppy-favicon.svg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/checkout.css">
    <link rel="stylesheet" href="../css/media.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/7cd9684d81.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <a href="../index.html">
            <img src="../img/poppy_logo.svg" alt="Poppy Logo" class="logo-poppy">
        </a>
        <nav class="desktop-nav">
            <i class="fa-solid fa-magnifying-glass"></i>
            <a href="../account/login.html"><i class="fa-regular fa-user"></i></a>
            <a href="../cart/index.html"><i class="fa-solid fa-cart-shopping"></i></a>
        </nav>
    </header>
    <main>
        <h1>Checkout</h1>
        <form id="checkout-form">
            <section class="delivery-form">
                <h2>Delivery</h2>
                <label for="name">Name:</label>
                <input type="text" name="name" id="name" placeholder="John Doe" required>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="johndoe@email.com" required>
                <label for="phone">Phone:</label>
                <input type="tel" name="phone" id="phone" placeholder="+47 12345678" required>
                <label for="street-address">Street Address:</label>
                <input type="text" name="street-address" id="street-address" placeholder="123 Example Street" required>
                <label for="post-code">Post Code:</label>
                <input type="text" name="post-code" id="post-code" placeholder="0485" required>
                <label for="city">City:</label>
                <input type="text" name="city" id="city" placeholder="Oslo" required>
            </section>
            <section class="payment-form">
                <h2>Payment Method</h2>
                <label>
                <input type="radio" name="payment" id="visa" required>Visa
                </label>
                <label>
                <input type="radio" name="payment" id="mastercard">Mastercard
                </label>
                <label>
                <input type="radio" name="payment" id="apple-pay">Apple Pay
                </label>
                <label>
                <input type="radio" name="payment" id="google-pay">Google Pay
                </label>
                <button type="submit" class="cta cta-primary cta-submit">Complete Purchase</button>
            </section>
        </form>
    </main>
        <footer>
            <nav class="mobile-nav">
                <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
                <a href="../account/login.html"><i class="fa-regular fa-user"></i></a>
                <a href="../cart/index.html"><i class="fa-solid fa-cart-shopping"></i></a>
            </nav>
            <div class="footer-desktop">
                <a href="../index.html">
                    <img src="../img/poppy-flower1.svg" alt="Poppy flower logo" class="logo-flower">
                </a>
                <ul>
                    <li>&copy; 2026 Poppy</li>
                    <li>Terms of Use</li>
                    <li>Privacy Policy</li>
                </ul>
                <div class="socials">
                    <i class="fa-brands fa-facebook"></i>
                    <i class="fa-brands fa-instagram"></i>
                    <i class="fa-brands fa-youtube"></i>
                </div>
            </div>
        </footer>
    <script src="../js/api.js"></script>
    <script src="../js/checkout.js"></script>
</body>
</html>
